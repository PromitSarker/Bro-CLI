name: Build Desktop Installers

on:
  push:
    branches:
      - master
      - testing
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop App
        run: pnpm --filter @uni-cli/desktop run package:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uni-cli-desktop-installer-${{ matrix.os }}
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.AppImage
          retention-days: 7
