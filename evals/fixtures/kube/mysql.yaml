apiVersion: v1
kind: Secret
metadata:
  name: uni-cli-mysql
  labels:
    app.kubernetes.io/name: uni-cli-mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: password
  MYSQL_DATABASE: uni-cli_den
  MYSQL_USER: uni-cli
  MYSQL_PASSWORD: uni-cli
---
apiVersion: v1
kind: Service
metadata:
  name: uni-cli-mysql
  labels:
    app.kubernetes.io/name: uni-cli-mysql
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: uni-cli-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-cli-mysql
  labels:
    app.kubernetes.io/name: uni-cli-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-cli-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-cli-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: uni-cli-mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - mysqladmin ping -h 127.0.0.1 -uuni-cli -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
      volumes:
        - name: data
          emptyDir: {}
