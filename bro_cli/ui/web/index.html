<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro-CLI AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f111a',
                        darker: '#090a0f',
                        accent: '#00e5ff',
                        panel: '#1a1d27'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #090a0f; color: #fff; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .glass {
            background: rgba(26, 29, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .message-enter {
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading dot animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Toggle Switch */
        input:checked ~ .block {
            background-color: #00e5ff;
        }
        input:checked ~ .dot {
            transform: translateX(100%);
            background-color: #090a0f;
        }
    </style>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden flex font-sans selection:bg-accent selection:text-dark">

    <!-- Sidebar -->
    <aside class="w-64 border-r border-white/10 glass flex flex-col hidden md:flex">
        <div class="p-4 border-b border-white/10 flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-blue-500 flex items-center justify-center font-bold text-dark">B</div>
            <h1 class="font-bold text-lg tracking-wide">Bro-CLI</h1>
        </div>
        
        <div class="flex-1 p-4 overflow-y-auto">
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Sessions</h2>
            <!-- Chat history placeholders -->
            <button class="w-full text-left px-3 py-2 rounded-md bg-white/5 text-sm text-gray-300 hover:bg-white/10 transition mb-1 truncate">
                Current Session
            </button>
        </div>
        
        <div class="p-4 border-t border-white/10 text-xs text-gray-500 flex justify-between items-center">
            <span id="status-text">Checking License...</span>
            <div id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark to-darker">
        
        <!-- Header (Mobile/Drag area) -->
        <header class="h-14 border-b border-white/10 glass flex items-center px-4 justify-between gap-4" style="-webkit-app-region: drag;">
            <div class="md:hidden font-bold text-accent">Bro-CLI</div>
            <div class="text-sm text-gray-400 mx-auto md:ml-auto md:mx-0">Local API Engine</div>
            
            <div class="flex items-center gap-4" style="-webkit-app-region: no-drag;">
                <label class="flex items-center cursor-pointer gap-2" title="Enable deep analysis and reporting">
                    <span class="text-xs font-semibold text-gray-400 tracking-wide uppercase hidden md:inline">Analyst Mode</span>
                    <div class="relative">
                        <input type="checkbox" id="analyst-toggle" class="sr-only">
                        <div class="block bg-gray-600 w-10 h-6 rounded-full transition-colors"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                    </div>
                </label>
                
                <button onclick="openSettings()" class="p-2 text-gray-400 hover:text-white transition" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Chat Output -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 pb-32">
            <!-- Initial Welcome Message -->
            <div class="flex gap-4 message-enter">
                <div class="w-8 h-8 rounded-full bg-panel border border-white/10 flex-shrink-0 flex items-center justify-center text-accent">B</div>
                <div class="bg-panel border border-white/10 rounded-2xl rounded-tl-sm p-4 max-w-[85%] shadow-lg">
                    <p class="text-gray-200">What's up bro? I'm your local AI. How can I help you today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 p-4 md:p-6 bg-gradient-to-t from-darker via-darker to-transparent">
            <div class="max-w-4xl mx-auto relative glass rounded-xl shadow-2xl overflow-hidden focus-within:ring-1 focus-within:ring-accent/50 transition">
                <textarea 
                    id="prompt-input" 
                    rows="1" 
                    class="w-full bg-transparent text-gray-100 p-4 pr-12 resize-none focus:outline-none placeholder-gray-600"
                    placeholder="Ask bro anything... (Press Enter to send)"
                    oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 150) + 'px'"
                ></textarea>
                <button id="send-btn" class="absolute right-3 bottom-3 p-2 text-accent hover:bg-accent/10 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="text-center text-xs text-gray-600 mt-2">Running locally. AI models require internet unless using local LLMs.</div>
        </div>
        
        <!-- Settings Modal -->
        <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="bg-panel border border-white/10 p-6 rounded-xl w-full max-w-md shadow-2xl">
                <h2 class="text-xl font-bold mb-4">API Configuration (BYOK)</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Provider</label>
                        <select id="config-provider" class="w-full bg-dark border border-white/10 rounded p-2 text-white focus:outline-none focus:border-accent">
                            <option value="gemini">Gemini</option>
                            <option value="groq">Groq</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Gemini API Key</label>
                        <input type="password" id="config-gemini" class="w-full bg-dark border border-white/10 rounded p-2 text-white focus:outline-none focus:border-accent" placeholder="AIzaSy...">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Groq API Key</label>
                        <input type="password" id="config-groq" class="w-full bg-dark border border-white/10 rounded p-2 text-white focus:outline-none focus:border-accent" placeholder="gsk_...">
                    </div>
                </div>
                
                <div class="mt-6 flex justify-end gap-3">
                    <button onclick="closeSettings()" class="px-4 py-2 rounded text-gray-400 hover:text-white transition">Cancel</button>
                    <button onclick="saveSettings()" class="px-4 py-2 bg-accent text-dark font-bold rounded hover:bg-cyan-400 transition">Save Keys</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        let isWaiting = false;
        
        // Base API URL (Assuming uvicorn runs on 8000)
        const API_URL = 'http://localhost:8000/api';

        // Check License/Status on load
        async function checkStatus() {
            try {
                const res = await fetch(`${API_URL}/status`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.license_valid) {
                        statusText.textContent = "License Valid";
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]";
                    } else {
                        statusText.textContent = "Unlicensed";
                        statusDot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
                        addMessage("Bro, your license is invalid or missing. Run 'bro auth login <key>' in the terminal.", 'ai');
                    }
                }
            } catch (e) {
                statusText.textContent = "Server Offline";
                statusDot.className = "w-2 h-2 rounded-full bg-gray-500";
            }
        }
        checkStatus();

        function addMessage(content, role = 'user') {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 message-enter ${role === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold ${
                role === 'user' ? 'bg-gradient-to-br from-purple-500 to-indigo-600 text-white' : 'bg-panel border border-white/10 text-accent'
            }`;
            avatar.textContent = role === 'user' ? 'U' : 'B';

            const bubble = document.createElement('div');
            bubble.className = `p-4 max-w-[85%] shadow-lg text-gray-200 prose prose-invert prose-p:leading-relaxed prose-pre:bg-black/50 prose-pre:border prose-pre:border-white/10 ${
                role === 'user' 
                ? 'bg-accent/10 border border-accent/20 rounded-2xl rounded-tr-sm text-white' 
                : 'bg-panel border border-white/10 rounded-2xl rounded-tl-sm'
            }`;
            
            // Render markdown if it's the AI
            if (role === 'ai') {
                bubble.innerHTML = marked.parse(content);
            } else {
                bubble.textContent = content;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            
            // Scroll to bottom
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
            
            return wrapper; // Return so we can remove it if it was a loader
        }

        function addLoader() {
            const wrapper = document.createElement('div');
            wrapper.id = 'ai-loader';
            wrapper.className = 'flex gap-4 message-enter';
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-panel border border-white/10 flex-shrink-0 flex items-center justify-center text-accent">B</div>
                <div class="bg-panel border border-white/10 rounded-2xl rounded-tl-sm p-4 h-12 flex items-center gap-1 shadow-lg">
                    <div class="w-2 h-2 rounded-full bg-accent typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-accent typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-accent typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return wrapper;
        }

        async function handleSend() {
            const text = promptInput.value.trim();
            if (!text || isWaiting) return;
            
            promptInput.value = '';
            promptInput.style.height = 'auto'; // reset height
            isWaiting = true;
            sendBtn.disabled = true;

            addMessage(text, 'user');
            const loader = addLoader();

            const isAnalystMode = document.getElementById('analyst-toggle').checked;

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, analyst_mode: isAnalystMode })
                });
                
                const data = await response.json();
                loader.remove();
                
                if (response.ok) {
                    addMessage(data.response, 'ai');
                } else {
                    addMessage(`[Error] ${data.detail || 'Something went wrong.'}`, 'ai');
                }
            } catch (err) {
                loader.remove();
                addMessage(`[Network Error] Could not reach the local engine.`, 'ai');
            }

            isWaiting = false;
            sendBtn.disabled = false;
            promptInput.focus();
        }

        sendBtn.addEventListener('click', handleSend);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // Settings Logic
        const settingsModal = document.getElementById('settings-modal');
        const configProvider = document.getElementById('config-provider');
        const configGemini = document.getElementById('config-gemini');
        const configGroq = document.getElementById('config-groq');

        async function openSettings() {
            try {
                const res = await fetch(`${API_URL}/config`);
                if (res.ok) {
                    const data = await res.json();
                    configProvider.value = data.provider || 'gemini';
                    configGemini.value = data.gemini_api_key || '';
                    configGroq.value = data.groq_api_key || '';
                }
            } catch (e) {
                console.error("Failed to load config");
            }
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        }

        async function saveSettings() {
            try {
                const res = await fetch(`${API_URL}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: configProvider.value,
                        gemini_api_key: configGemini.value,
                        groq_api_key: configGroq.value
                    })
                });
                if (res.ok) {
                    closeSettings();
                    addMessage("API Keys saved successfully! You are using your own keys (BYOK).", 'ai');
                }
            } catch (e) {
                alert("Failed to save settings.");
            }
        }
    </script>
</body>
</html>
