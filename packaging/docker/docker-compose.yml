services:
  uni-cli-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep this in sync with apps/server/package.json if you want a pinned release.
        UNICLI_SERVER_VERSION: 0.18.4
        OPENCODE_VERSION: 1.17.11
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # UNICLI_TOKEN: "..."
      # UNICLI_HOST_TOKEN: "..."
      # Optional: UNICLI_APPROVAL_MODE: "auto"
      # Optional: UNICLI_APPROVAL_TIMEOUT_MS: "30000"
      # Historical path retained so existing ./data volumes keep working.
      # Only a directory name; the orchestrator CLI itself is gone.
      UNICLI_DATA_DIR: /data/uni-cli-orchestrator
      UNICLI_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
